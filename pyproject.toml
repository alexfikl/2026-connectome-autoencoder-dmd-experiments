[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling>=1.10",
]

[project]
name = "fractal-dmd-autoencoder"
version = "2026.0"
description = "Experiments with learning quadratic networks with DMD Autoencoders"
keywords = [
    "Complex systems theory",
    "Fractals",
    "Oscillators",
]
license = "MIT"
maintainers = [ { name = "Alexandru Fikl", email = "alexfikl@gmail.com" } ]
authors = [ { name = "Alexandru Fikl", email = "alexfikl@gmail.com" } ]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
dependencies = [
    "array-api-compat",
    "matplotlib>=3.10",
    "networkx>=3.5",
    "nneuroutil @ git+https://github.com/alexfikl/nneuroutil.git#egg=nneuroutil",
    "numpy>=2",
    "orbitkit @ git+https://github.com/alexfikl/orbitkit.git#egg=orbitkit",
    "rich",
    "scienceplots>=2.2",
    "scikit-learn>=1.7",
]

[dependency-groups]
dev = [
    "pyproject-fmt",
    "reuse",
    "ruff",
    "ty",
    "typos",
    "uv",
]
flax = [ "flax" ]
torch = [ "torch" ]

[tool.ruff]
line-length = 88
preview = true
lint.select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # flake8
    "F",   # flake8
    "FBT", # flake8-boolean-trap
    "G",   # flake8-logging-format
    "I",   # flake8-isort
    "ISC", # flake8-implicit-str-concat
    "N",   # pep8-naming
    "NPY", # numpy
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RUF", # ruff
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # flake8
]
lint.ignore = [
    "assert",                                    # assert
    "exec-builtin",                              # exec-builtin
    "import-outside-top-level",                  # import-outside-top-level
    "invalid-argument-name",                     # lowercase-argument
    "magic-value-comparison",                    # magic-value-comparison
    "mixed-case-variable-in-class-scope",        # mixedcase-variable
    "module-import-not-at-top-of-file",          # module-import-not-at-top-of-file
    "no-self-use",                               # no-self-use
    "non-augmented-assignment",                  # non-augmented-assignment
    "non-lowercase-variable-in-function",        # lowercase-variable
    "single-line-implicit-string-concatenation", # single-line-implicit-string-concatenation
    "suspicious-pickle-import",                  # insecure-pickle
    "suspicious-pickle-usage",                   # insecure-pickle-load
    "too-many-arguments",                        # too-many-arguments
    "too-many-branches",                         # too-many-branches
    "too-many-locals",                           # too-many-locals
    "too-many-positional-arguments",             # too-many-positional
    "too-many-return-statements",                # too-many-return-statements
    "too-many-statements",                       # too-many-statements
    "unnecessary-dunder-call",                   # unnecessary-dunder-call
    "unnecessary-literal-within-tuple-call",     # incorrectly-parenthesized-tuple-in-subscript
]
lint.flake8-quotes.docstring-quotes = "double"
lint.flake8-quotes.inline-quotes = "double"
lint.flake8-quotes.multiline-quotes = "double"
lint.isort.force-wrap-aliases = true
lint.isort.known-first-party = [
    "commonlib",
    "nneuroutil",
    "orbitkit",
    "torchlib",
]
lint.isort.required-imports = [
    "from __future__ import annotations",
]

[tool.typos]
default.extend-ignore-re = [ "(?Rm)^.*#\\s*spell:\\s*disable$" ]
default.extend-words.yhat = "yhat"
default.extend-words.ND = "ND"
